backend:
  name: github
  repo: ITspecialist-tech/Project-APF
  branch: main
  # base_url + auth_endpoint are injected at runtime in /admin (required for Vercel)

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "nusrl_site"
    label: "Site Content"
    files:
      - label: "Site Configuration"
        name: "nusrl_site_settings"
        file: "src/content/site.json"
        format: "json"
        fields:
          - { label: "Site Name", name: "siteName", widget: "string" }
          - { label: "University", name: "university", widget: "string" }
          - { label: "University Short", name: "universityShort", widget: "string" }
          - { label: "University URL", name: "universityUrl", widget: "string" }
          - { label: "Projects URL", name: "projectsUrl", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "text" }
          - label: "Homepage Section Text"
            name: "sections"
            widget: "object"
            fields:
              - label: "Initiatives Section"
                name: "initiatives"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Subtitle", name: "subtitle", widget: "text" }
              - label: "Activities Section"
                name: "activities"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Subtitle", name: "subtitle", widget: "text" }
                  - { label: "Button Label", name: "buttonLabel", widget: "string" }
              - label: "Publications Section"
                name: "publications"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Subtitle", name: "subtitle", widget: "text" }
                  - { label: "Button Label", name: "buttonLabel", widget: "string" }
              - label: "Team Section"
                name: "team"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Subtitle", name: "subtitle", widget: "text" }
              - label: "Stakeholders Section"
                name: "partners"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Subtitle", name: "subtitle", widget: "text" }
              - label: "Gallery Section"
                name: "gallery"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Subtitle", name: "subtitle", widget: "text" }
                  - { label: "Button Label", name: "buttonLabel", widget: "string" }
              - label: "Contact Section"
                name: "contact"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Subtitle", name: "subtitle", widget: "text" }
                  - { label: "Button Label", name: "buttonLabel", widget: "string" }
          - label: "Hero Buttons"
            name: "hero"
            widget: "object"
            fields:
              - label: "Primary Button"
                name: "ctaPrimary"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link", name: "href", widget: "string", hint: "Use a section link such as #about or a full URL." }
              - label: "Secondary Button"
                name: "ctaSecondary"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Link", name: "href", widget: "string", hint: "Use a section link such as #initiatives or a full URL." }
          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Journey Text", name: "journey", widget: "text" }
              - { label: "Constitutional Text", name: "constitutional", widget: "text" }
          - label: "Mission and Values"
            name: "mission"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Mission Items"
                name: "missionItems"
                widget: "list"
                field: { label: "Mission Item", name: "item", widget: "string" }
              - label: "Values"
                name: "values"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "Initiatives"
            name: "initiatives"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Stakeholders / Partners"
            name: "partners"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Type", name: "type", widget: "string" }
          - label: "Team"
            name: "team"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Phone", name: "phone", widget: "string", required: false }
              - { label: "Bio", name: "bio", widget: "text" }
          - label: "Patrons"
            name: "patrons"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Note", name: "note", widget: "text", required: false }
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Phone", name: "phone", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Address", name: "address", widget: "text" }
              - { label: "Office Hours", name: "hours", widget: "string", required: false }
          - label: "Navigation"
            name: "nav"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link", name: "href", widget: "string", hint: "Use a section link such as #contact or a page link such as /activities." }

  - name: "nusrl_activities"
    label: "Activities"
    files:
      - label: "Activities List"
        name: "nusrl_activity_list"
        file: "src/content/activities.json"
        format: "json"
        fields:
          - label: "Activities"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Summary", name: "summary", widget: "text" }
              - { label: "Venue", name: "venue", widget: "string" }

  - name: "nusrl_publications"
    label: "Publications"
    files:
      - label: "Publications List"
        name: "nusrl_publication_list"
        file: "src/content/publications.json"
        format: "json"
        fields:
          - label: "Publications"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Type", name: "type", widget: "string" }
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "PDF Path", name: "pdfPath", widget: "string", required: false, hint: "e.g. /documents/report.pdf" }

  - name: "nusrl_gallery"
    label: "Event Gallery"
    files:
      - label: "Gallery"
        name: "nusrl_gallery_list"
        file: "src/content/gallery.json"
        format: "json"
        fields:
          - label: "Gallery Items"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
              - { label: "Venue", name: "venue", widget: "string" }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Alt Text", name: "alt", widget: "string" }
